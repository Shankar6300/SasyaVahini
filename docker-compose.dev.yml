# ──────────────────────────────────────────────────────────────────────────────
# SasyaVahini — Docker Compose (Development Mode)
#
# Complete microservice stack with live hot-reload:
#   - postgres:        PostgreSQL 16 with persistent volume (exposed on host port 5433)
#   - routing-service: FastAPI CVRP logistics solver with uvicorn --reload (port 8001)
#   - ml-service:      FastAPI Quantile Demand & Pricing engine with uvicorn --reload (port 8000)
#   - backend:         Express API with nodemon hot-reload & Prisma migrations (port 5000)
#   - frontend:        Vite React dev server with HMR (port 5173)
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#   docker compose -f docker-compose.dev.yml down -v   (to remove volumes)
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL Database ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sasyavahini-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sasyavahini
    ports:
      - "5433:5432"   # Use 5433 on host to avoid conflict with local PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sasyavahini"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Logistics Routing Service (FastAPI + OR-Tools + CVRP) ──────────────────
  routing-service:
    build:
      context: .
      dockerfile: routing-service/Dockerfile
    container_name: sasyavahini-routing
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./routing-service/main.py:/app/main.py
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/docs')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── AI Demand Forecasting & Pricing Intelligence (FastAPI + Scikit-Learn) ──
  ml-service:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    container_name: sasyavahini-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./ml-service/app:/app/app
      - ./ml-service/data:/app/data
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API (Express + Prisma + Nodemon) ───────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: sasyavahini-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/sasyavahini?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@postgres:5432/sasyavahini?schema=public"
      JWT_ACCESS_SECRET: "docker-dev-access-secret-change-in-production"
      JWT_REFRESH_SECRET: "docker-dev-refresh-secret-change-in-production"
      JWT_ACCESS_EXPIRES_IN: "15m"
      JWT_REFRESH_EXPIRES_IN: "7d"
      ENABLE_REAL_OTP: "false"
      OTP_EXPIRY_SECONDS: "300"
      ML_SERVICE_URL: "http://ml-service:8000"
      ML_SERVICE_TIMEOUT_MS: "5000"
      ROUTING_SERVICE_URL: "http://routing-service:8001"
      LOGISTICS_SERVICE_URL: "http://routing-service:8001"
      LOGISTICS_DATA_SOURCE: "mock"
      OSRM_URL: "https://router.project-osrm.org"
      CORS_ORIGIN: "http://localhost:5173,http://localhost:3000"
    ports:
      - "5000:5000"
    volumes:
      # Mount source code for hot-reload — node_modules stays in container
      - ./backend/src:/app/backend/src
      - ./backend/prisma:/app/backend/prisma
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
      routing-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Run migrations, generate client, seed, then start dev server with nodemon
    command: >
      sh -c "
        echo '⏳ Running Prisma migrations...' &&
        cd backend &&
        npx prisma migrate deploy &&
        npx prisma generate &&
        echo '🌱 Seeding database...' &&
        node prisma/seed.js || true &&
        echo '🚀 Starting backend dev server...' &&
        npx nodemon src/index.js
      "

  # ── Frontend (Vite + React + HMR) ─────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    container_name: sasyavahini-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: "http://localhost:5000/api"
      VITE_APP_NAME: "SasyaVahini"
    ports:
      - "5173:5173"
    volumes:
      # Mount source code for HMR — node_modules stays in container
      - ./frontend/src:/app/frontend/src
      - ./frontend/public:/app/frontend/public
      - ./frontend/index.html:/app/frontend/index.html
      - ./frontend/vite.config.js:/app/frontend/vite.config.js
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
